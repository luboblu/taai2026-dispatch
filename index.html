<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAAI 2026 派工表</title>
<style>
/* 版面：頂部是分頁與發布狀態；首頁先說還缺什麼，再列各區卡片；所有指派都用姓名標籤。 */
:root{
  --bg:#f1f4f1;--surface:#ffffff;--surface2:#e8eee9;--line:#dce3dd;--line2:#bcc8bf;--fg:#16211b;--muted:#5c6b62;
  --accent:#1c6a50;--accent-fg:#ffffff;--accent-soft:#dbefe5;
  --good:#17714e;--good-soft:#dcf3e7;--warn:#8c5a07;--warn-soft:#fbefd4;--bad:#b0352b;--bad-soft:#fae4e1;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 8px 24px rgba(20,40,30,.05);
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --gutter:max(16px,calc((100vw - 1120px)/2));
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1412;--surface:#181f1c;--surface2:#232c28;--line:#2b3631;--line2:#46544c;--fg:#e8eeea;--muted:#9aa9a0;
  --accent:#74cdaa;--accent-fg:#08261b;--accent-soft:#1c3a2e;
  --good:#79d3aa;--good-soft:#193629;--warn:#e8bc69;--warn-soft:#3b2f18;--bad:#f2978e;--bad-soft:#44211d;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block;width:1em;height:1em;flex:none}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:6px 13px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;justify-content:center}
button:hover{background:var(--surface2)}
button:disabled{cursor:default;opacity:.6}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.primary:hover{background:var(--accent);opacity:.9}
button.danger{color:var(--bad);border-color:var(--bad);background:none}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:5px 9px}
button.ghost:hover{background:var(--surface2);color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 頂部 */
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px var(--gutter)}
.brand{font-size:16px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:8px;min-width:0}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:9px}
.tabs button:hover{background:var(--surface2);color:var(--fg)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:11.5px;line-height:1;border-radius:99px;padding:3px 6px;background:var(--warn-soft);color:var(--warn);font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.spacer{flex:1}
.actions{display:flex;gap:6px;align-items:center}
.saved{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.saved.ok::before,.saved.dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.saved.dirty{color:var(--warn);font-weight:600}
.saved.dirty::before{background:var(--warn)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line2);border-radius:9px;padding:6px 13px;background:var(--surface);white-space:nowrap}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:var(--surface2)}
.menu-list{position:absolute;right:0;top:calc(100% + 5px);z-index:6;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;display:grid;box-shadow:0 10px 30px rgba(10,20,15,.18)}
.menu-list button{border:0;background:none;justify-content:flex-start;padding:7px 10px;border-radius:7px}
.menu-list button:hover{background:var(--surface2)}

/* 版面骨架 */
main{padding:20px var(--gutter) 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
main section{min-width:0}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h2{font-size:22px;line-height:1.3;text-wrap:balance}
.place{color:var(--muted);font-size:14px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sec-title span{font-weight:400}
.muted{color:var(--muted)}
.tip{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad)}
.back{justify-self:start;margin:-8px 0 -12px -9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* 首頁摘要 */
.hero{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.hero-main{flex:1 1 260px;min-width:0;display:grid;gap:8px}
.hero-title{font-size:20px;font-weight:700}
.hero-title b{font-size:28px;color:var(--accent);font-variant-numeric:tabular-nums;margin:0 2px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.todo{flex:1 1 340px;display:flex;flex-wrap:wrap;gap:8px}
.todo button{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600;font-size:14px;border-radius:99px;padding:6px 10px 6px 14px}
.todo button:hover{background:var(--warn-soft);opacity:.85}
.todo button.bad{background:var(--bad-soft);color:var(--bad)}
.todo button.bad:hover{background:var(--bad-soft)}

/* 區域卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 2px var(--accent)}
.card-head{width:100%;background:none;border:0;padding:0;justify-content:space-between;align-items:flex-start;text-align:left;white-space:normal;border-radius:6px}
.card-head:hover{background:none}
.card-head:hover .card-name{color:var(--accent)}
.card-name{display:block;font-size:16.5px;font-weight:700}
.card-place{display:block;font-size:13px;color:var(--muted)}
.card-head svg{color:var(--muted);margin-top:4px}
.field-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.card-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;min-height:26px;margin-top:auto;font-size:13px;color:var(--muted)}
.card-foot .warn{color:var(--warn);font-weight:600}
.bus-count{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.card-add{border:1.5px dashed var(--line2);border-radius:14px;background:none;color:var(--muted);min-height:130px;font-weight:600}
.card-add:hover{color:var(--accent);border-color:var(--accent);background:none}

/* 姓名標籤 */
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;padding:4px 6px;background:var(--bg);border:1px solid transparent;border-radius:10px;cursor:text}
.chips:focus-within{border-color:var(--accent);background:var(--surface)}
.chips.empty{border:1px dashed var(--line2);background:none}
.chips.empty:focus-within{border-style:solid;border-color:var(--accent)}
.chips.static{background:none;padding:0;min-height:0;cursor:default}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--fg);font-weight:600;font-size:14px;border-radius:99px;padding:3px 5px 3px 11px;max-width:100%;overflow-wrap:anywhere}
.chips.static .chip{padding:3px 11px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.na{background:var(--surface2);color:var(--muted);font-weight:400}
.chip-x{border:0;background:none;padding:3px;border-radius:50%;color:inherit;opacity:.6;font-size:11px}
.chip-x:hover{background:rgba(127,127,127,.22);opacity:1}
.chip-input{flex:1 1 96px;min-width:80px;border:0;background:none;outline:0;padding:3px 5px;font-size:14px}
.chip-input::placeholder{color:var(--muted)}
.chip-na{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 6px;text-decoration:underline;text-underline-offset:2px}
.chip-na:hover{background:none;color:var(--fg)}
.none{color:var(--warn);font-size:14px;font-weight:600}
.none.na{color:var(--muted);font-weight:400}
.clash{display:flex;gap:5px;align-items:flex-start;color:var(--bad);font-size:12.5px;line-height:1.45;margin-top:5px}
.clash svg{margin-top:2px}

/* 狀態 */
.status{position:relative;display:inline-flex;align-items:center;border-radius:99px;font-size:12.5px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.status::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor;pointer-events:none}
.status select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:3px 22px 3px 20px;cursor:pointer;font-size:12.5px;border-radius:99px;color:inherit}
.status select option{color:var(--fg);background:var(--surface)}
.status::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;margin-top:-4px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);pointer-events:none}
.status.static{padding:3px 11px 3px 20px}
.status.static::after{display:none}
.status.s1{background:var(--warn-soft);color:var(--warn)}
.status.s2{background:var(--good-soft);color:var(--good)}

/* 列表 */
.list{overflow:visible}
.row,.sess{border-top:1px solid var(--line)}
.row:first-child,.sess:first-child{border-top:0}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,1.35fr) auto;gap:8px 16px;align-items:start;padding:12px 16px}
.row-time,.sess-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap;padding-top:6px}
.row-time small{display:block;font-size:12px}
.row-main{min-width:0;padding-top:5px}
.row-main b,.sess-head b{font-weight:600}
.row-main small,.sess-head small{display:block;color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
small.note{color:var(--fg)}
.row-people{min-width:0}
.row-side{display:flex;gap:4px;align-items:center;padding-top:5px;justify-content:flex-end}
.sess{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 16px}
.sess-body{min-width:0;display:grid;gap:8px}
.sess-head{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:flex-start;padding-top:5px}
.sess-head>div:first-child{min-width:0;flex:1 1 200px}
.sess-actions{display:flex;gap:2px;align-items:center;margin-top:-4px}
@media (hover:hover){.sess-actions .ghost{opacity:.6;transition:opacity .12s}.sess:hover .sess-actions .ghost,.sess-actions .ghost:focus-visible{opacity:1}}
.sub{display:grid;grid-template-columns:minmax(84px,150px) minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.sub-label{padding-top:8px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.sub-label small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.sub-side{display:flex;gap:2px;align-items:center;padding-top:5px}
.lead-box{padding:14px 16px;display:grid;gap:4px;max-width:640px}
.lead-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.lead-line .status{margin-top:7px}
.empty-state{padding:30px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}

/* 工作篩選 */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:4px 11px;border-radius:8px;font-size:14px}
.seg button:hover{background:none;color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.inline-select{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.inline-select select{border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding:5px 8px;color:var(--fg);max-width:60vw}

/* 人員 */
.add-people{display:flex;gap:8px;align-items:flex-start}
.add-people textarea{flex:1;min-width:0;min-height:40px;height:40px;resize:vertical}
.person{overflow:hidden}
.person summary{cursor:pointer;list-style:none;padding:11px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.person summary::-webkit-details-marker{display:none}
.person summary:hover{background:var(--surface2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.person-name{font-weight:600;overflow-wrap:anywhere}
.person-count{font-size:13px;color:var(--muted);margin-left:auto;display:flex;gap:8px;align-items:center}
.person-count svg{transition:transform .15s}
.person[open] .person-count svg{transform:rotate(90deg)}
.person .body{padding:6px 16px 16px;display:grid;gap:14px;border-top:1px solid var(--line)}
.tag-bad{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
.day-tasks{display:grid;gap:4px}
.day-label{font-size:12.5px;color:var(--muted);font-weight:600}
.tasks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:14px}
.tasks .t{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tasks b{font-weight:600}
.tasks small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.person-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center}

/* 表單與對話框 */
.fields{display:flex;flex-wrap:wrap;gap:10px}
.fields label,.fields .field{display:grid;gap:4px;font-size:13px;color:var(--muted);flex:1 1 170px;min-width:0}
.fields .wide{flex-basis:100%}
.fields input,.fields select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;color:var(--fg);font-size:15px;max-width:100%}
.fields .chips{color:var(--fg)}
.fields .chip-input{font-size:14px;width:auto;border:0;background:none;padding:3px 5px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);width:min(500px,calc(100vw - 32px));padding:22px}
dialog::backdrop{background:rgba(8,18,13,.5)}
dialog form{display:grid;gap:14px}
dialog h3{font-size:18px}
.row-end{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.err{color:var(--bad);font-size:13.5px}
.role-row{display:flex;gap:6px}
.role-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:7px 10px}
.stack{display:grid;gap:8px}

/* 備註 */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.note-box{padding:16px;display:grid;gap:8px;align-content:start}
.note-box h3{font-size:16px}
.note-box textarea{min-height:240px;resize:vertical;line-height:1.65;border-color:transparent}
.note-box textarea:focus{border-color:var(--accent);background:var(--surface);outline:0}
.note-view{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:calc(100vw - 32px)}
.ro .edit-only{display:none!important}

@media (max-width:860px){
  .bar{padding-top:8px;padding-bottom:0}
  .saved{display:none}
  .brand{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .bar>.spacer{display:none}
  .actions{flex:none;gap:4px}
  .actions button,.actions .menu summary{padding:5px 10px;font-size:14px}
  .tabs{order:5;flex-basis:100%;margin:0 -4px;padding-bottom:6px;overflow-x:auto}
  .tabs button{padding:5px 10px}
  main{padding-top:16px;gap:18px}
}
@media (max-width:680px){
  .row{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px}
  .row-time{grid-column:1/-1;padding:0}
  .row-main{grid-column:1;padding:0}
  .row-side{grid-column:2;grid-row:2;padding:0}
  .row-people{grid-column:1/-1}
  .sess{grid-template-columns:minmax(0,1fr);padding:12px 14px}
  .sess-time{padding:0}
  .sub{grid-template-columns:minmax(0,1fr) auto}
  .sub-label{grid-column:1;padding-top:0}
  .sub-side{grid-column:2;grid-row:1;padding:0}
  .sub-people{grid-column:1/-1}
  .hero{padding:16px}
  .add-people{flex-direction:column;align-items:stretch}
  .tasks li{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand">TAAI 2026 派工表</h1>
    <nav class="tabs" id="tabs" aria-label="切換檢視"></nav>
    <span class="spacer"></span>
    <span id="saved" class="saved" role="status"></span>
    <div class="actions">
      <button id="btnPublish" class="primary" type="button" hidden>發布更新</button>
      <details class="menu" id="menu"><summary>匯出</summary><div class="menu-list">
        <button id="btnXlsx" type="button">Excel</button>
        <button id="btnCsv" type="button">CSV</button>
        <button id="btnJson" class="edit-only" type="button">備份資料</button>
        <button id="btnImport" class="edit-only" type="button">還原備份</button>
      </div></details>
      <button id="btnLogin" class="ghost" type="button" hidden>編輯登入</button>
      <input id="fileImport" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
</header>
<main id="main"></main>
<div id="toast" role="status" hidden></div>
<datalist id="peopleList"></datalist>

<dialog id="dlgTask"><form method="dialog" id="formTask">
  <h3 id="dlgTaskTitle">編輯場次</h3>
  <div class="fields">
    <label style="flex-basis:100%">名稱<input id="fTitle" required maxlength="100"></label>
    <label style="flex-basis:100%">補充說明<input id="fSub" maxlength="150"></label>
    <label style="flex-basis:100%">備註<input id="fNote" maxlength="200" placeholder="例如：需要兩支無線麥克風"></label>
    <label>區域<select id="fRoom"></select></label>
    <label>日期<select id="fDay"></select></label>
    <label>開始<input id="fStart" type="time" required></label>
    <label>結束<input id="fEnd" type="time" required></label>
  </div>
  <p class="err" id="fErr" hidden></p>
  <div class="row-end">
    <button type="button" class="danger" id="fDelete">刪除這項</button>
    <span class="spacer"></span>
    <button type="button" id="fCancel">取消</button>
    <button type="submit" class="primary">儲存</button>
  </div>
</form></dialog>

<dialog id="dlgLogin"><form method="dialog" id="formLogin">
  <h3>編輯登入</h3>
  <p class="tip">請貼上只授權給這個 repo 的 GitHub fine-grained token（Contents: Read and write）。它只會存在這個瀏覽器裡，共用電腦上用完請登出。</p>
  <div class="fields"><label style="flex-basis:100%">GitHub token<input id="fToken" type="password" autocomplete="off" required></label></div>
  <p class="err" id="loginErr" hidden></p>
  <div class="row-end"><button type="button" id="loginCancel">取消</button><button type="submit" class="primary">登入</button></div>
</form></dialog>

<dialog id="dlgJob"><form method="dialog" id="formJob">
  <h3 id="dlgJobTitle">新增工作</h3>
  <div class="fields">
    <label class="wide">工作名稱<input id="jTitle" required maxlength="100" placeholder="例如：司儀、計時、貴賓接待"></label>
    <label class="wide">對應的議程場次<select id="jLink"></select></label>
    <p class="tip wide" id="jLinkInfo" hidden style="flex-basis:100%"></p>

  s.roles=roles;

  return s;
}

function progress(s){
  let need=0,done=0;
  for(const r of state.roles[s.room]||[]){const v=s.assign[r.id];if(isNA(v))continue;need++;if(names(v).length)done++}
  return {need,done,cls:need&&done>=need?"full":done?"part":""};
}
function sumProgress(list){return list.reduce((a,s)=>{const p=progress(s);a.need+=p.need;a.done+=p.done;return a},{need:0,done:0})}

}

}

function allTasks(){
  const map=new Map();
  for(const s of state.sessions)for(const r of state.roles[s.room]||[])for(const n of names(s.assign[r.id])){
    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:r.name,roleId:r.id});

    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:"負責人",roleId:"lead"});
  }
  for(const j of state.jobs)for(const n of names(j.people)){
    const s=jobInfo(j);
    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:s.link?linkLabel(s.link):"自訂工作",roleId:"job"});
  }
  for(const n of Object.keys(state.people))if(!map.has(n))map.set(n,[]);
  map.forEach(list=>list.sort((a,b)=>dayOf(a.s.day).k.localeCompare(dayOf(b.s.day).k)||byTime(a.s,b.s)));
  return map;
}
function overlaps(a,b){
  if(a.id===b.id||a.day!==b.day||a.day==="x")return false;
  if((a.isLead||b.isLead)&&a.room===b.room)return false;
  if(a.linkId&&(a.linkId===b.linkId||a.linkId===b.id))return false;
  if(b.linkId&&b.linkId===a.id)return false;
  return a.start<b.end&&b.start<a.end;
}
function conflictInfo(map){
  const bad=new Map();
  map.forEach((list,n)=>{list.forEach(t=>{const hit=list.filter(o=>overlaps(t.s,o.s));if(hit.length){if(!bad.has(n))bad.set(n,new Map());bad.get(n).set(t.s.id,hit)}})});
  return bad;
}

function chipSet(kind,key,sub,v){
  if(kind==="lead")state.leads[key]=v;
  else if(kind==="job"){const j=state.jobs.find(x=>x.id===key);if(j)j.people=v}
  else if(kind==="assign"){const s=state.sessions.find(x=>x.id===key);if(s)s.assign[sub]=v}
  else jobDraft=v;
}
function taskIds(kind,key){
  if(kind==="lead")return leadTasks(key).map(t=>t.id);
  if(kind==="job")return ["job-"+key];
  if(kind==="assign")return [key];
  return [];
}
function hitLabel(t){const r=roomOf(t.s.room);return (t.s.isLead?r.name+" 負責人":r.name+" "+t.s.title)+"（"+t.s.start+"–"+t.s.end+"）"}
function clashes(kind,key,list){
  if(!mode.canEdit)return [];
  const ids=taskIds(kind,key),out=[];
  for(const n of list){
    const m=CTX.bad.get(n);if(!m)continue;
    const hits=[];
    ids.forEach(id=>(m.get(id)||[]).forEach(t=>{const l=hitLabel(t);if(!hits.includes(l))hits.push(l)}));
    if(hits.length)out.push({n,hits});
  }
  return out;
}
function chipsHtml(kind,key,sub,label){
  const v=chipGet(kind,key,sub),list=names(v),na=isNA(v),clash=clashes(kind,key,list),badSet=new Set(clash.map(c=>c.n));
  if(!mode.canEdit&&kind!=="draft"){
    const inner=list.map(n=>'<span class="chip">'+esc(n)+"</span>").join("")||(na?'<span class="none na">不需要</span>':'<span class="none">尚未指派</span>');
    return '<div class="chips static">'+inner+"</div>";
  }
  const empty=!list.length&&!na;
  let h='<div class="chips'+(empty?" empty":"")+'" data-chips data-kind="'+esc(kind)+'" data-key="'+esc(key)+'" data-sub="'+esc(sub||"")+'">';
  if(na)h+='<span class="chip na">不需要<button type="button" class="chip-x" data-clear="1" aria-label="取消不需要">'+ICON.x+"</button></span>";
  h+=list.map(n=>'<span class="chip'+(badSet.has(n)?" bad":"")+'">'+esc(n)+'<button type="button" class="chip-x" data-remove="'+esc(n)+'" aria-label="移除 '+esc(n)+'">'+ICON.x+"</button></span>").join("");
  if(!na)h+='<input id="'+esc(chipId(kind,key,sub))+'" class="chip-input" list="peopleList" autocomplete="off" aria-label="'+esc((label||"負責人")+" 新增姓名")+'" placeholder="'+(list.length?"再加一位":"輸入姓名，按 Enter")+'">';
  if(empty&&kind!=="draft"&&kind!=="job")h+='<button type="button" class="chip-na" data-naset="1">不需要</button>';
  h+="</div>";
  if(clash.length)h+='<p class="clash">'+ICON.warn+"<span>"+clash.map(c=>esc(c.n)+" 同時段也在 "+esc(c.hits.slice(0,2).join("、"))+(c.hits.length>2?" 等 "+c.hits.length+" 項":"")).join("；")+"</span></p>";
  return h;
}
function statusHtml(kind,key,val,hasPeople){
  const i=Math.max(0,STATUS.indexOf(val));
  if(!mode.canEdit)return i?'<span class="status static s'+i+'">'+esc(STATUS[i])+"</span>":"";
  if(!hasPeople)return "";
  return '<span class="status s'+i+'"><select id="st-'+esc(kind)+"-"+esc(key)+'" aria-label="通知狀態" data-stkind="'+esc(kind)+'" data-stkey="'+esc(key)+'">'+STATUS.map(x=>"<option"+(x===STATUS[i]?" selected":"")+">"+x+"</option>").join("")+"</select></span>";
}
function renderTabs(){
  const open=state.jobs.filter(j=>!names(j.people).length).length,bad=mode.canEdit?CTX.bad.size:0;
  const tab=(v,label,badge)=>'<button type="button" data-tab="'+v+'" class="'+(ui.view===v||(v==="overview"&&ui.view==="room")?"on":"")+'">'+label+(badge||"")+"</button>";
  $("tabs").innerHTML=tab("overview","各區負責人")
    +tab("jobs","工作",open?'<span class="badge">'+open+"</span>":"")
    +tab("people","人員",bad?'<span class="badge bad">'+bad+"</span>":"")
    +tab("notes","備註");
}
function banners(){
  let h="";
  if(ui.message&&ui.msgErr)h+='<div class="banner" role="alert">'+esc(ui.message)+"</div>";
  if(!storageOK)h+='<div class="banner" role="alert">這個瀏覽器無法自動儲存，關閉前請用「匯出」裡的備份保存資料。</div>';
  return h;
}
function timeRange(i){return i.start||i.end?esc(i.start)+"–"+esc(i.end):""}
function jobWhere(i){const r=roomOf(i.room);return r.name+(i.link?" · "+linkLabel(i.link):"")}
function jobRow(j,withDay){
  const i=jobInfo(j),has=names(j.people).length>0;
  return '<article class="row"><div class="row-time">'+(withDay?"<small>"+esc(dayOf(i.day).short)+"</small>":"")+timeRange(i)+"</div>"
    +'<div class="row-main"><b>'+esc(j.title)+"</b><small>"+esc(jobWhere(i))+"</small>"+(j.note?'<small class="note">'+esc(j.note)+"</small>":"")+"</div>"
    +'<div class="row-people">'+chipsHtml("job",j.id,"",j.title)+"</div>"
    +'<div class="row-side">'+statusHtml("job",j.id,j.status,has)+(mode.canEdit?'<button type="button" class="ghost" data-editjob="'+esc(j.id)+'">編輯</button>':"")+"</div></article>";
}
function renderJobs(){
  const isOpen=j=>!names(j.people).length;
  const isClash=j=>names(j.people).some(n=>CTX.bad.has(n)&&CTX.bad.get(n).has("job-"+j.id));
  const clashN=mode.canEdit?state.jobs.filter(isClash).length:0,openN=state.jobs.filter(isOpen).length;
  if(ui.jobFilter==="clash"&&!clashN)ui.jobFilter="all";
  if(ui.jobFilter==="open"&&!openN)ui.jobFilter="all";
  const areas=ROOMS.filter(r=>jobsInRoom(r.k).length);
  if(ui.jobArea&&!areas.some(r=>r.k===ui.jobArea))ui.jobArea="";
  const pass=j=>(ui.jobFilter==="all"||(ui.jobFilter==="open"&&isOpen(j))||(ui.jobFilter==="clash"&&isClash(j)))&&(!ui.jobArea||jobInfo(j).room===ui.jobArea);
  let h=banners()+'<div class="head"><h2>工作</h2><span class="spacer"></span>'+(mode.canEdit?'<button type="button" class="primary" data-addjob="1">'+ICON.plus+"新增工作</button>":"")+"</div>";
  if(!state.jobs.length){
    h+='<section class="panel empty-state"><p>'+(mode.canEdit?"還沒有工作。新增時選好對應的議程場次，時間和地點會自動帶入。":"目前還沒有工作。")+"</p>"+(mode.canEdit?'<button type="button" class="primary" data-addjob="1">'+ICON.plus+"新增第一項工作</button>":"")+"</section>";
    $("main").innerHTML=h;return;
  }
  const seg=(k,label,n)=>'<button type="button" data-jobfilter="'+k+'" class="'+(ui.jobFilter===k?"on":"")+'">'+label+" "+n+"</button>";
  h+='<div class="filters">'+(openN||clashN?'<div class="seg" role="group" aria-label="篩選工作">'+seg("all","全部",state.jobs.length)+(openN?seg("open","未指派",openN):"")+(clashN?seg("clash","撞時段",clashN):"")+"</div>":"");
  if(areas.length>1)h+='<label class="inline-select">區域<select id="jobArea"><option value="">全部</option>'+areas.map(r=>'<option value="'+esc(r.k)+'"'+(ui.jobArea===r.k?" selected":"")+">"+esc(r.name)+"</option>").join("")+"</select></label>";
  h+="</div>";
  let shown=0;
  for(const d of DAYS){
    const rows=state.jobs.filter(j=>pass(j)&&jobInfo(j).day===d.k).sort((a,b)=>{const x=jobInfo(a),y=jobInfo(b);return byTime(x,y)||ROOMS.findIndex(r=>r.k===x.room)-ROOMS.findIndex(r=>r.k===y.room)});
    if(!rows.length)continue;
    shown+=rows.length;
    h+='<section><h3 class="sec-title">'+esc(d.name)+"<span>"+rows.length+' 項</span></h3><div class="panel list">'+rows.map(j=>jobRow(j)).join("")+"</div></section>";
  }
  if(!shown)h+='<p class="muted">沒有符合條件的工作。</p>';
  $("main").innerHTML=h;
}
function renderNotes(){

  if(mode.canEdit){
    h+='<div class="notes-grid"><section class="panel note-box"><h3>公開備註</h3><p class="tip">'+(mode.hosted?"發布後所有打開網址的人都看得到，不要寫電話或其他個資。":"匯出 Excel 時會一起帶出。")+'</p><textarea id="noteShared" data-board="notes" aria-label="公開備註" placeholder="例如：11/18 前確認各廳設備">'+esc(state.notes)+"</textarea></section>"
      +'<section class="panel note-box"><h3>我的筆記</h3><p class="tip">不會發布，也不會匯出 Excel，只存在這個瀏覽器。</p><textarea id="notePrivate" data-board="privateNotes" aria-label="我的筆記" placeholder="想到什麼先記在這裡">'+esc(state.privateNotes)+"</textarea></section></div>";
  }else h+=state.notes.trim()?'<section class="panel note-box"><div class="note-view">'+esc(state.notes)+"</div></section>":'<section class="panel empty-state"><p>目前沒有備註。</p></section>';

}

        +(roles.length?statusHtml("session",s.id,s.status,has):"")
        +(mode.canEdit?'<button type="button" class="ghost" data-addjob="1" data-link="'+esc(s.id)+'">'+ICON.plus+'工作</button><button type="button" class="ghost" data-edit="'+esc(s.id)+'">編輯</button>':"")+"</div></div>";
      for(const r of roles)h+='<div class="sub"><div class="sub-label">'+esc(r.name)+'</div><div class="sub-people">'+chipsHtml("assign",s.id,r.id,s.title+" "+r.name)+"</div></div>";

  if(free.length)h+='<section><h3 class="sec-title">其他工作<span>'+free.length+' 項</span></h3><div class="panel list">'+free.map(j=>jobRow(j,true)).join("")+"</div></section>";
  if(!list.length&&!free.length)h+='<section class="panel empty-state"><p>這個區域還沒有工作。</p>'+(mode.canEdit?'<button type="button" class="primary" data-addjob="1" data-job-room="'+esc(room.k)+'">'+ICON.plus+"新增第一項工作</button>":"")+"</section>";
  $("main").innerHTML=h;
}
function areaCard(r){
  const sessN=state.sessions.filter(s=>s.room===r.k).length,js=jobsInRoom(r.k),openJ=js.filter(j=>!names(j.people).length).length;
  let h='<article class="panel card" id="card-'+esc(r.k)+'"><button type="button" class="card-head" data-open-room="'+esc(r.k)+'"><span><span class="card-name">'+esc(r.name)+'</span><span class="card-place">'+esc(r.place)+"</span></span>"+ICON.next+"</button>";
  if(r.lead){
    const has=names(state.leads[r.k]).length>0;
    h+='<div><div class="field-label">負責人</div>'+chipsHtml("lead",r.k,"",r.name+" 負責人")+"</div>";
    const meta=[];
    if(sessN)meta.push(sessN+" 個場次");
    if(js.length)meta.push(js.length+" 項工作");
    h+='<div class="card-foot"><span>'+esc(meta.join(" · "))+(openJ?' <span class="warn">'+openJ+" 項未指派</span>":"")+"</span>"+statusHtml("lead",r.k,state.leadStatus[r.k],has)+"</div>";
  }else{
    const q=sumProgress(state.sessions.filter(s=>s.room===r.k)),pct=q.need?Math.round(q.done/q.need*100):0;
    h+='<div class="stack"><div class="bus-count">隨車已指派 '+q.done+" / "+q.need+' 班</div><div class="meter"><span style="width:'+pct+'%"></span></div></div>';
    if(js.length)h+='<div class="card-foot"><span>'+js.length+" 項工作"+(openJ?' <span class="warn">'+openJ+" 項未指派</span>":"")+"</span></div>";
  }
  return h+"</article>";
}
function renderOverview(){
  const tp=ROOMS.reduce((a,r)=>{const p=areaProgress(r.k);a.need+=p.need;a.done+=p.done;return a},{need:0,done:0});
  const open=tp.need-tp.done,pct=tp.need?Math.round(tp.done/tp.need*100):0;
  const openAreas=ROOMS.filter(r=>r.lead&&!isNA(state.leads[r.k])&&!names(state.leads[r.k]).length);
  const openJobs=state.jobs.filter(j=>!names(j.people).length).length;
  const seatRooms=ROOMS.map(r=>({r,gap:(q=>q.need-q.done)(sumProgress(state.sessions.filter(s=>s.room===r.k)))})).filter(x=>x.gap>0);
  const bad=mode.canEdit?CTX.bad.size:0;
  let todo="";
  if(openAreas.length)todo+='<button type="button" data-todo="areas">'+openAreas.length+" 區沒有負責人"+ICON.next+"</button>";
  for(const x of seatRooms)todo+='<button type="button" data-todo="room" data-todo-room="'+esc(x.r.k)+'">'+esc(x.r.name)+" 缺 "+x.gap+(x.r.k==="bus"?" 班":" 項")+ICON.next+"</button>";
  if(openJobs)todo+='<button type="button" data-todo="jobs">'+openJobs+" 項工作未指派"+ICON.next+"</button>";
  if(bad)todo+='<button type="button" class="bad" data-todo="people">'+bad+" 人撞時段"+ICON.next+"</button>";
  const when=!mode.canEdit&&state.updatedAt?"最後更新 "+fmtTime(state.updatedAt):"已指派 "+tp.done+" / "+tp.need;
  let h=banners()+'<section class="panel hero"><div class="hero-main"><p class="hero-title">'+(open?"還有<b>"+open+"</b>項待指派":"全部都指派好了")+'</p><div class="meter" role="img" aria-label="已指派 '+tp.done+" / "+tp.need+'"><span style="width:'+pct+'%"></span></div><p class="tip">'+esc(when)+"</p></div>"+(todo?'<div class="todo">'+todo+"</div>":"")+"</section>";
  const hall=["main","A","B","C","D","P"];
  h+='<section><h3 class="sec-title">會議廳與海報</h3><div class="cards">'+ROOMS.filter(r=>hall.includes(r.k)).map(areaCard).join("")+"</div></section>";
  h+='<section><h3 class="sec-title">現場服務與交通</h3><div class="cards">'+ROOMS.filter(r=>!hall.includes(r.k)).map(areaCard).join("")
    +(mode.canEdit?'<button type="button" class="card-add" data-addarea="1">'+ICON.plus+"新增區域</button>":"")+"</div></section>";
  $("main").innerHTML=h;
}
const dayLabel=t=>t.s.noTime?"全程":dayOf(t.s.day).short;
function taskLine(t){const r=roomOf(t.s.room);return (t.s.noTime?"":t.s.start+"–"+t.s.end+"  ")+r.name+(r.noPlace?"":"（"+r.place+"）")+"  "+t.s.title+"｜"+t.role}
function personText(n,list){
  let out="【TAAI 2026 工作分配】"+n+"\n";
  const allDay=list.filter(t=>t.s.noTime);
  if(allDay.length)out+="\n全程\n"+allDay.map(taskLine).join("\n")+"\n";
  for(const d of DAYS){const ds=list.filter(t=>t.s.day===d.k&&!t.s.noTime);if(!ds.length)continue;out+="\n"+d.short+"\n"+ds.map(taskLine).join("\n")+"\n"}
  return out.trim();
}
const SEP=/([,，、;；\/／\n]+)/;
function mapNames(v,fn){
  const parts=String(v||"").split(SEP).map(x=>SEP.test(x)?x:fn(x.trim()));
  return parts.filter((x,i)=>x!==null).join("").replace(/^[,，、;；\/／\n\s]+|[,，、;；\/／\n\s]+$/g,"").replace(/([,，、;；\/／\n])[,，、;；\/／\n]+/g,"$1");
}
function eachField(fn){
  for(const s of state.sessions)for(const r in s.assign)s.assign[r]=mapNames(s.assign[r],fn);
  for(const k in state.leads)state.leads[k]=mapNames(state.leads[k],fn);
  for(const j of state.jobs)j.people=mapNames(j.people,fn);
}
function renamePerson(oldName,newName){
  if(state.people[newName]||allTasks().has(newName)){
    if(!window.confirm("名單裡已經有「"+newName+"」，要把「"+oldName+"」併過去嗎？"))return false;
  }
  eachField(x=>x===oldName?newName:x);
  const a=state.people[oldName]||{},b=state.people[newName]||{};
  delete state.people[oldName];
  state.people[newName]={...a,...b};
  ui.openPerson=newName;
  return true;
}
function removePerson(n){
  const c=(allTasks().get(n)||[]).length;
  if(!window.confirm("確定移除「"+n+"」？"+(c?"這個人目前的 "+c+" 項工作會變成未指派。":"")))return;
  eachField(x=>x===n?null:x);
  delete state.people[n];
  save();render();
}
function taskTitle(t){
  if(t.s.isLead)return roomOf(t.s.room).name+" 負責人";
  if(t.roleId==="job")return t.s.title;
  return t.role;
}
function taskWhere(t){
  const r=roomOf(t.s.room);
  if(t.s.isLead)return r.noPlace?"":r.place;
  if(t.roleId==="job")return r.name+(t.s.link?" · "+linkLabel(t.s.link):"");
  return r.name+" · "+t.s.title;
}
function personTasksHtml(list,cf){
  const li=t=>{
    const c=mode.canEdit&&cf&&cf.has(t.s.id),w=taskWhere(t);
    return '<li><span class="t">'+(t.s.noTime?"全程":timeRange(t.s))+"</span><span><b>"+esc(taskTitle(t))+"</b>"+(c?' <span class="tag-bad">撞時段</span>':"")+(w?"<small>"+esc(w)+"</small>":"")+"</span></li>";
  };
  let h="";
  const allDay=list.filter(t=>t.s.noTime);
  if(allDay.length)h+='<div class="day-tasks"><div class="day-label">全程</div><ul class="tasks">'+allDay.map(li).join("")+"</ul></div>";
  for(const d of DAYS){
    const ds=list.filter(t=>t.s.day===d.k&&!t.s.noTime);
    if(ds.length)h+='<div class="day-tasks"><div class="day-label">'+esc(d.name)+'</div><ul class="tasks">'+ds.map(li).join("")+"</ul></div>";
  }
  return h;
}
function renderPeople(){
  const map=CTX.tasks,bad=mode.canEdit?CTX.bad:new Map();

  h+='<section class="stack">';
  ns.forEach((n,i)=>{
    const list=map.get(n),info=state.people[n]||{},cf=bad.get(n);
    const first=[...n][0]||"?";

let pointerDown=false,pendingAfter=null;

function afterPointer(fn){if(pointerDown)pendingAfter=fn;else fn()}
const SPLIT=/[,，、;；\/／\n]+/;
function renderDraft(){
  const had=document.activeElement&&document.activeElement.id==="chip-draft-job";
  $("jPeopleWrap").innerHTML=chipsHtml("draft","job","","負責人");

  if(kind==="draft"){afterPointer(renderDraft);return}
  save();afterPointer(refresh);

function commitChip(input){
  const g=input.closest("[data-chips]"),txt=input.value.trim();
  if(!g||!txt){input.value="";return false}
  const d=g.dataset,val=chipGet(d.kind,d.key,d.sub);
  const cur=isNA(val)?[]:names(val);let na=false;
  for(const t of txt.split(SPLIT).map(x=>x.trim()).filter(Boolean)){
    if(NA.test(t)||t==="不需要"){na=true;continue}
    if(!cur.includes(t))cur.push(t);
  }
  chipSet(d.kind,d.key,d.sub,na&&!cur.length?"—":cur.join("、"));
  input.value="";
  return true;
}
const isChipInput=el=>el&&el.classList&&el.classList.contains("chip-input");
document.addEventListener("keydown",e=>{
  const el=e.target;
  if(!isChipInput(el)||e.isComposing||e.keyCode===229)return;
  if(e.key==="Enter"){
    e.preventDefault();
    if(commitChip(el))chipChanged(el.closest("[data-chips]").dataset.kind);
  }else if(e.key==="Backspace"&&!el.value){
    const d=el.closest("[data-chips]").dataset,cur=names(chipGet(d.kind,d.key,d.sub));
    if(cur.length){cur.pop();chipSet(d.kind,d.key,d.sub,cur.join("、"));chipChanged(d.kind)}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(!isChipInput(el)||e.isComposing)return;
  const t=e.inputType;
  if(SPLIT.test(el.value)||((!t||t==="insertReplacementText")&&el.value.trim())){
    if(commitChip(el))chipChanged(el.closest("[data-chips]").dataset.kind);
  }
});
document.addEventListener("compositionend",e=>{
  const el=e.target;
  if(isChipInput(el)&&SPLIT.test(el.value)&&commitChip(el))chipChanged(el.closest("[data-chips]").dataset.kind);
});
document.addEventListener("focusout",e=>{
  const el=e.target;
  if(rendering||!isChipInput(el)||!el.value.trim())return;
  const kind=el.closest("[data-chips]").dataset.kind;
  if(commitChip(el)){
    if(kind==="draft"){setTimeout(()=>afterPointer(renderDraft),0);return}
    save();setTimeout(()=>afterPointer(refresh),0);
  }
});
document.addEventListener("click",e=>{
  const g=e.target.closest&&e.target.closest("[data-chips]");
  if(!g)return;
  const d=g.dataset,b=e.target.closest("button");
  if(!b){const i=g.querySelector(".chip-input");if(i&&e.target!==i)i.focus();return}
  if(b.dataset.remove!==undefined){
    chipSet(d.kind,d.key,d.sub,names(chipGet(d.kind,d.key,d.sub)).filter(n=>n!==b.dataset.remove).join("、"));
    chipChanged(d.kind);
  }else if(b.dataset.clear){chipSet(d.kind,d.key,d.sub,"");chipChanged(d.kind)}
  else if(b.dataset.naset){chipSet(d.kind,d.key,d.sub,"—");chipChanged(d.kind)}
});

    const r=roomOf(s.room);
    for(const role of state.roles[s.room]||[]){
      const v=s.assign[role.id]||"";
      if(isNA(v))continue;
      rows.push([dayOf(s.day).short,s.start,s.end,r.name,r.noPlace?"":r.place,s.title,s.sub,role.name,v.trim(),s.status,s.note]);
    }
  }
  for(const j of jobsSorted()){const i=jobInfo(j),r=roomOf(i.room);rows.push([dayOf(i.day).short,i.start,i.end,r.name,r.noPlace?"":r.place,j.title,i.link?"對應："+linkLabel(i.link):"自訂工作","工作",j.people.trim(),j.status,j.note])}
  return rows;
}
function jobsSorted(){
  return [...state.jobs].sort((a,b)=>{const x=jobInfo(a),y=jobInfo(b);return DAYS.findIndex(d=>d.k===x.day)-DAYS.findIndex(d=>d.k===y.day)||byTime(x,y)});
}
function jobRows(){
  return [["日期","開始","結束","區域","工作","對應議程","負責人","狀態","備註"],...jobsSorted().map(j=>{const i=jobInfo(j);return [dayOf(i.day).short,i.start,i.end,roomOf(i.room).name,j.title,i.link?linkLabel(i.link):"",j.people.trim(),j.status,j.note]})];
}
function peopleRows(){
  const rows=[["姓名","組別","聯絡方式","日期","開始","結束","區域","工作","職務／對應場次","時段重疊"]],map=allTasks(),bad=conflictInfo(map);
  [...map.keys()].sort((a,b)=>a.localeCompare(b,"zh-Hant")).forEach(n=>{
    const i=state.people[n]||{},list=map.get(n);
    if(!list.length)rows.push([n,i.group||"",i.contact||"","","","","","","",""]);
    list.forEach(t=>rows.push([n,i.group||"",i.contact||"",dayLabel(t),t.s.start,t.s.end,roomOf(t.s.room).name,t.s.title,t.role,bad.get(n)&&bad.get(n).has(t.s.id)?"是":""]));
  });
  return rows;
}
function roomRows(r){
  const roles=state.roles[r.k]||[],st=roles.length?["狀態"]:[],rows=[["日期","開始","結束","場次／工作","說明",...roles.map(x=>x.name),...st,"備註"]];
  sortedSessions(state.sessions.filter(s=>s.room===r.k)).forEach(s=>rows.push([dayOf(s.day).short,s.start,s.end,s.title,s.sub,...roles.map(x=>s.assign[x.id]||""),...(roles.length?[s.status]:[]),s.note]));
  return rows;
}
const csvCell=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function csvText(rows){return "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")}

// 不依賴外部函式庫的 xlsx 產生器（ZIP 不壓縮）
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcTable[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
  let p=0;for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
const xml=s=>String(s==null?"":s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colName=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
const widthOf=s=>[...String(s||"")].reduce((a,c)=>a+(c.charCodeAt(0)>255?2:1),0);
function sheetXml(rows){
  const cols=Math.max(...rows.map(r=>r.length)),w=[];
  for(let c=0;c<cols;c++)w[c]=Math.min(46,Math.max(8,...rows.map(r=>widthOf(r[c])+2)));
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>'
    +w.map((v,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+v+'" customWidth="1"/>').join("")+"</cols><sheetData>";
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">'+r.map((v,ci)=>'<c r="'+colName(ci)+(ri+1)+'" s="'+(ri?1:2)+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+"</t></is></c>").join("")+"</row>";
  });
  return x+"</sheetData></worksheet>";
}
function buildXlsx(){
  const leadRows=[["區域","地點","負責人","狀態"],...ROOMS.filter(r=>r.lead).map(r=>[r.name,r.place,(state.leads[r.k]||"").trim(),state.leadStatus[r.k]||STATUS[0]])];
  const sheets=[{name:"負責人總覽",rows:leadRows},{name:"工作",rows:jobRows()},...(state.notes.trim()?[{name:"備註",rows:[["備註"],...state.notes.split("\n").map(x=>[x])]}]:[]),{name:"總表",rows:flatRows()},...ROOMS.map(r=>({name:r.name,rows:roomRows(r)})),{name:"人員工作單",rows:peopleRows()}];
  const seen=new Set();
  sheets.forEach(s=>{
    const base=(String(s.name).replace(/[\[\]:*?\/\\]/g," ").trim()||"工作表").slice(0,28);let n=base,c=2;
    while(seen.has(n))n=base+" "+(c++);
    seen.add(n);s.name=n;
  });
  const files=[
    {name:"[Content_Types].xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+"</Types>"},
    {name:"_rels/.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+"</sheets></workbook>"},
    {name:"xl/_rels/workbook.xml.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1C6A50"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="49" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/></cellXfs></styleSheet>'}
  ];
  sheets.forEach((s,i)=>files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",text:sheetXml(s.rows)}));
  return zipStore(files);
}
$("btnXlsx").addEventListener("click",()=>download("TAAI2026派工表-"+stamp()+".xlsx",new Blob([buildXlsx()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})));
$("btnCsv").addEventListener("click",()=>download("TAAI2026派工表-"+stamp()+".csv",new Blob([csvText(flatRows())],{type:"text/csv;charset=utf-8"})));
$("btnJson").addEventListener("click",()=>download("TAAI2026派工備份-"+stamp()+".json",new Blob([JSON.stringify(state,null,2)],{type:"application/json"})));
$("btnImport").addEventListener("click",()=>$("fileImport").click());
$("fileImport").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!valid(p))throw new Error("format");
      if(!window.confirm("還原會用備份檔「"+f.name+"」覆蓋目前所有內容，確定嗎？"))return;
      state=normalize(p);saveNow();ui.message="已從「"+f.name+"」還原。";ui.msgErr=false;
    }catch(err){ui.message="這個檔案不是派工表備份，內容沒有變更。請選擇按「備份」存下的 .json 檔。";ui.msgErr=true}
    render();
  };
  rd.readAsText(f);e.target.value="";

// GitHub Pages：所有人讀 data.json，登入後才能發布
const TOKEN_KEY=KEY+"-token";
const ghHeaders=()=>({Authorization:"Bearer "+mode.token,Accept:"application/vnd.github+json"});
const contentsUrl=()=>API+"/repos/"+REPO.owner+"/"+REPO.repo+"/contents/data.json";
async function fetchRemote(){
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const p=JSON.parse(await r.text());
  if(!valid(p))throw new Error("format");
  return p;
}
function adoptRemote(remote){
  const at=remote.updatedAt;
  const s=normalize(remote);s.updatedAt=at;
  mode.remoteText=publishable(s);
  return s;
}
function mergeLocal(remoteState){
  let local=null;
  try{const raw=localStorage.getItem(KEY);local=raw?JSON.parse(raw):null}catch(e){}
  if(!valid(local))return remoteState;
  local=normalize(local);
  if(local.updatedAt===remoteState.updatedAt)return local;
  if(publishable(local)!==mode.remoteText){
    try{localStorage.setItem(KEY+"-replaced",JSON.stringify(local))}catch(e){}
  }
  remoteState.privateNotes=local.privateNotes||"";
  for(const n in local.people){const c=local.people[n]&&local.people[n].contact;if(c){remoteState.people[n]=remoteState.people[n]||{};remoteState.people[n].contact=c}}
  return remoteState;
}
const noWriteMessage=()=>"這個 token 沒有寫入權限。請到 GitHub 的 token 設定，把 "+REPO.repo+" 加進 Repository access，並把 Contents 設為 Read and write，儲存後再試一次。";
async function checkToken(){
  const r=await fetch(API+"/repos/"+REPO.owner+"/"+REPO.repo,{headers:ghHeaders()});
  if(!r.ok)return "bad";
  const j=await r.json();
  if(!(j.permissions&&j.permissions.push))return "bad";
  // 故意送無效內容：權限足夠時 GitHub 回 422 且不會寫入，權限不足則回 403
  const probe=await fetch(contentsUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify({message:"check",content:"!"})});
  if(probe.status===401)return "bad";
  return probe.status===403?"nowrite":"ok";
}
async function loadHosted(){
  try{
    const remote=adoptRemote(await fetchRemote());
    state=mode.canEdit?mergeLocal(remote):remote;
  }catch(e){
    ui.message="讀不到最新資料，目前顯示的是預設內容。請稍後重新整理。";ui.msgErr=true;
    if(mode.canEdit){try{const l=JSON.parse(localStorage.getItem(KEY)||"null");if(valid(l))state=normalize(l)}catch(err){}}
  }
  render();
}
async function boot(){
  if(!REPO)return;
  try{mode.token=localStorage.getItem(TOKEN_KEY)}catch(e){}
  if(mode.token){
    let res="error";try{res=await checkToken()}catch(e){}
    if(res==="bad"){mode.token=null;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}ui.message="編輯登入已失效，請重新登入。";ui.msgErr=true}
    else{
      mode.canEdit=true;
      if(res==="nowrite"){ui.message=noWriteMessage();ui.msgErr=true}
    }
  }
  await loadHosted();
  setInterval(async()=>{
    if(mode.canEdit||document.hidden)return;
    try{const p=await fetchRemote();if(p.updatedAt!==state.updatedAt){state=adoptRemote(p);render()}}catch(e){}
  },60000);
}
function toB64(text){
  const b=new TextEncoder().encode(text);let s="";
  for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));
  return btoa(s);
}
$("btnPublish").addEventListener("click",async()=>{
  mode.publishing=true;$("btnPublish").textContent="發布中…";setHostedStatus();
  try{
    const head=await fetch(contentsUrl()+"?t="+Date.now(),{headers:ghHeaders()});
    if(head.status!==200&&head.status!==404)throw new Error("status "+head.status);
    const sha=head.status===200?(await head.json()).sha:undefined;
    const body=publishable(state),at=new Date().toISOString(),obj=JSON.parse(body);obj.updatedAt=at;
    const put=await fetch(contentsUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify({message:"更新派工表",content:toB64(JSON.stringify(obj,null,1)),...(sha?{sha}:{})})});
    if(!put.ok)throw new Error("status "+put.status);
    state.updatedAt=at;mode.remoteText=body;saveNow();
    ui.message="已發布。大家重新整理後約 1 分鐘內會看到。";ui.msgErr=false;
  }catch(e){
    const m=String(e.message||"");
    ui.message=/403/.test(m)?"發布失敗："+noWriteMessage():/401/.test(m)?"發布失敗：token 已失效或過期，請登出後用新的 token 登入。":/409|422/.test(m)?"發布失敗：GitHub 上的資料剛更新過，請再按一次發布。":"發布失敗，內容還保留在這個瀏覽器。請確認網路後再試。";ui.msgErr=true;
  }
  mode.publishing=false;$("btnPublish").textContent="發布更新";render();
});
document.addEventListener("click",e=>{document.querySelectorAll("details.menu[open]").forEach(m=>{if(!m.contains(e.target)||e.target.closest(".menu-list"))m.open=false})});
$("btnLogin").addEventListener("click",async()=>{
  if(mode.canEdit){
    if(publishable(state)!==mode.remoteText&&!window.confirm("還有未發布的變更，登出後別人看不到。確定登出嗎？"))return;
    saveNow();mode.canEdit=false;mode.token=null;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
    await loadHosted();return;
  }
  $("fToken").value="";$("loginErr").hidden=true;$("dlgLogin").showModal();
});
$("loginCancel").addEventListener("click",()=>$("dlgLogin").close());
$("formLogin").addEventListener("submit",async e=>{
  e.preventDefault();
  mode.token=$("fToken").value.trim();
  let res="error";try{res=await checkToken()}catch(err){}
  if(res!=="ok"){
    mode.token=null;$("loginErr").hidden=false;
    $("loginErr").textContent=res==="nowrite"?noWriteMessage():res==="bad"?"登入失敗：這個 token 無效，或它的帳號沒有這個 repo 的權限。":"連不上 GitHub，請確認網路後再試。";
    return;
  }
  try{localStorage.setItem(TOKEN_KEY,mode.token)}catch(err){}
  mode.canEdit=true;$("fToken").value="";$("dlgLogin").close();
  await loadHosted();
});
window.TAAI={buildXlsx,flatRows,peopleRows,csvText,getState:()=>state,mode,publishable};
parseHash();
render();
boot();
