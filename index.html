<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAAI 2026 派工表</title>
<style>
/* 版面：首頁是一區一張卡片，點進去才看場次；次要功能收進「匯出」選單。 */
:root{
  --bg:#f4f6f4;--surface:#ffffff;--surface2:#edf1ee;--line:#dde3df;--fg:#1a2420;--muted:#66736d;
  --accent:#20634f;--accent-fg:#ffffff;--accent-soft:#e0efe9;
  --good:#1b7350;--good-soft:#dff3e9;--warn:#94600d;--warn-soft:#fbf0d9;--bad:#b4362e;--bad-soft:#fbe6e4;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121715;--surface:#1b211e;--surface2:#262e2a;--line:#323b36;--fg:#e9eeeb;--muted:#9aa7a0;
  --accent:#7cc9ae;--accent-fg:#0e1a15;--accent-soft:#1f3a30;
  --good:#7bd3aa;--good-soft:#1b3a2c;--warn:#e7bb68;--warn-soft:#3e321a;--bad:#f1948c;--bad-soft:#47231f;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover{background:var(--surface2)}
button:disabled{cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.primary:hover{opacity:.9;background:var(--accent)}
button.primary:disabled{opacity:.45}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;color:var(--muted);padding:4px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px max(16px,calc((100vw - 1040px)/2))}
.brand{font-size:17px;font-weight:700;margin:0}
.spacer{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#saved,#total{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:18px;padding:0 max(16px,calc((100vw - 1040px)/2))}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:4px 0 9px;color:var(--muted)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:var(--surface2)}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:6;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;display:grid;box-shadow:0 8px 24px rgba(10,20,15,.14)}
.menu-list button{border:0;text-align:left;padding:7px 10px;border-radius:6px}
main{padding:20px 16px 48px;max-width:1072px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
main section{min-width:0}
.banner{padding:9px 13px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
h2{margin:0;font-size:22px}
h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.tip{font-size:13px;color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;display:grid;gap:10px;align-content:start}
.card-top{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:8px;border:0;padding:0;text-align:left;background:none}
.card-top:hover{background:none}
.card-top:hover .card-name{color:var(--accent)}
.card-name{display:block;font-size:17px;font-weight:700}
.card-place{display:block;font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px;line-height:1.2}
.lead-row{display:flex;align-items:center;gap:8px}
.lead-row input{flex:1;min-width:0;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 10px;font-weight:600}
.lead-row input::placeholder{font-weight:400;color:var(--muted)}
.lead-row input:hover,.lead-row input:focus{border-color:var(--line)}
input.conflict{background:var(--bad-soft)!important;border-color:var(--bad)!important}
.statuspill{flex:none;border:0;border-radius:99px;font-size:12px;padding:3px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.statuspill.s1{background:var(--warn-soft);color:var(--warn)}
.statuspill.s2{background:var(--good-soft);color:var(--good)}
.statuspill:disabled{opacity:1}
.bus-count{font-weight:600;padding:7px 0}
.leadbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;max-width:520px}
.lead-label{flex:none;font-size:13px;color:var(--muted)}
.back{justify-self:start;margin-left:-8px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
td.time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;width:1%}
td.task{min-width:190px}
td.task b{font-weight:600}
td.task small{display:block;color:var(--muted);line-height:1.35}
td input,td select{width:100%;min-width:100px;background:var(--bg);border:1px solid transparent;border-radius:7px;padding:6px 9px}
td input:hover,td input:focus,td select:hover{border-color:var(--line)}
td.note input{background:transparent}
td.note{min-width:130px}
td.st{min-width:92px}
td.act{width:1%}
tr.flash td{background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.person summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.person .body{padding:2px 14px 14px;display:grid;gap:10px}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fields label{display:grid;gap:3px;font-size:12.5px;color:var(--muted);flex:1 1 170px}
.fields input,.fields select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);font-size:14px}
.tasks{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.tasks li{font-variant-numeric:tabular-nums}
.tasks li.conflict{color:var(--bad)}
.stack{display:grid;gap:8px}
.bulk summary{cursor:pointer;color:var(--muted);font-size:14px}
.bulk[open] summary{margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);width:min(480px,calc(100vw - 32px));padding:20px}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog form{display:grid;gap:12px}
.row-end{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.role-row{display:flex;gap:6px}
.role-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.card-jobs{font-size:13px;color:var(--muted)}
.card-add{border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--muted);min-height:118px;font-weight:600}
.card-add:hover{color:var(--accent);border-color:var(--accent);background:none}
.note-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.note-box h3{margin:0;font-size:15px;color:var(--fg)}
.note-box textarea{min-height:190px;resize:vertical;font-size:15px;line-height:1.6;background:var(--bg);border-color:transparent}
.note-view{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.job-line{display:block;margin-top:4px;font-size:13px}
button.job-line{border:0;padding:0;text-align:left;background:none;color:var(--accent)}
button.job-line:hover{background:none;text-decoration:underline}
.job-none{color:var(--bad)}
.ro .edit-only{display:none!important}
.ro input:disabled,.ro select:disabled{opacity:1;-webkit-text-fill-color:var(--fg);color:var(--fg);background:transparent;padding-left:0;appearance:none;-webkit-appearance:none}
.ro .note input:placeholder-shown{visibility:hidden}
.ro input.conflict{background:transparent!important;border-color:transparent!important}
.ro .pill.bad,.ro .tasks li.conflict{display:revert}
.ro .tabs .pill.bad{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand">TAAI 2026 派工表</h1>
    <span id="total"></span>
    <span class="spacer"></span>
    <span id="saved"></span>
    <div class="actions">
      <button id="btnPublish" class="primary" type="button" hidden>發布更新</button>
      <details class="menu" id="menu"><summary>匯出</summary><div class="menu-list">
        <button id="btnXlsx" type="button">Excel</button>
        <button id="btnCsv" type="button">CSV</button>
        <button id="btnJson" class="edit-only" type="button">備份資料</button>
        <button id="btnImport" class="edit-only" type="button">還原備份</button>
      </div></details>
      <button id="btnLogin" class="ghost" type="button" hidden>編輯登入</button>
      <input id="fileImport" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="切換檢視"></nav>
</header>
<main id="main"></main>
<datalist id="peopleList"></datalist>

<dialog id="dlgTask"><form method="dialog" id="formTask">
  <h3 id="dlgTaskTitle">編輯工作</h3>
  <div class="fields">
    <label style="flex-basis:100%">名稱<input id="fTitle" required maxlength="100"></label>
    <label style="flex-basis:100%">補充說明<input id="fSub" maxlength="150"></label>
    <label>廳別<select id="fRoom"></select></label>
    <label>日期<select id="fDay"></select></label>
    <label>開始<input id="fStart" type="time" required></label>
    <label>結束<input id="fEnd" type="time" required></label>
  </div>
  <p class="tip" id="fErr" hidden></p>
  <div class="row-end">
    <button type="button" class="danger" id="fDelete">刪除這項</button>
    <span class="spacer"></span>
    <button type="button" id="fCancel">取消</button>
    <button type="submit" class="primary">儲存</button>
  </div>
</form></dialog>

<dialog id="dlgLogin"><form method="dialog" id="formLogin">
  <h3>編輯登入</h3>
  <p class="tip">請貼上只授權給這個 repo 的 GitHub fine-grained token（Contents: Read and write）。它只會存在這個瀏覽器裡，共用電腦上用完請登出。</p>
  <div class="fields"><label style="flex-basis:100%">GitHub token<input id="fToken" type="password" autocomplete="off" required></label></div>
  <p class="tip" id="loginErr" hidden></p>
  <div class="row-end"><button type="button" id="loginCancel">取消</button><button type="submit" class="primary">登入</button></div>
</form></dialog>

<dialog id="dlgJob"><form method="dialog" id="formJob">
  <h3 id="dlgJobTitle">新增工作</h3>
  <div class="fields">
    <label style="flex-basis:100%">工作名稱<input id="jTitle" required maxlength="100" placeholder="例如：計時、麥克風、貴賓接待"></label>
    <label style="flex-basis:100%">對應議程<select id="jLink"></select></label>
    <label id="jRoomWrap">區域<select id="jRoom"></select></label>
    <label id="jDayWrap">日期<select id="jDay"></select></label>
    <label id="jStartWrap">開始<input id="jStart" type="time"></label>
    <label id="jEndWrap">結束<input id="jEnd" type="time"></label>
    <label style="flex-basis:100%">負責人<input id="jPeople" list="peopleList" placeholder="可先留空，多人用頓號分開"></label>
    <label style="flex-basis:100%">備註<input id="jNote" maxlength="200"></label>
  </div>
  <p class="tip" id="jErr" hidden></p>
  <div class="row-end">
    <button type="button" class="danger" id="jDelete">刪除</button>
    <span class="spacer"></span>
    <button type="button" id="jCancel">取消</button>
    <button type="submit" class="primary">儲存</button>
  </div>
</form></dialog>

<dialog id="dlgArea"><form method="dialog" id="formArea">
  <h3 id="dlgAreaTitle">新增區域</h3>
  <div class="fields">
    <label style="flex-basis:100%">區域名稱<input id="aName" required maxlength="40" placeholder="例如：一樓報到處"></label>
    <label style="flex-basis:100%">地點<input id="aPlace" maxlength="60" placeholder="例如：1F 大廳，不確定可留空"></label>
  </div>
  <p class="tip" id="aErr" hidden></p>
  <div class="row-end">
    <button type="button" class="danger" id="aDelete">刪除區域</button>
    <span class="spacer"></span>
    <button type="button" id="aCancel">取消</button>
    <button type="submit" class="primary">儲存</button>
  </div>
</form></dialog>

<dialog id="dlgRoles"><form method="dialog" id="formRoles">
  <h3 id="dlgRolesTitle">職務設定</h3>
  <p class="tip">這裡的職務會成為此廳別派工表的欄位。刪除職務會一併清除該欄已填的人員。</p>
  <div class="stack" id="roleRows"></div>
  <div><button type="button" id="roleAdd">新增職務</button></div>
  <div class="row-end">
    <button type="button" id="rolesCancel">取消</button>
    <button type="submit" class="primary">儲存</button>
  </div>
</form></dialog>

const busSessions=()=>BUS.map((b,i)=>({id:"bus"+i,room:"bus",day:b[0],start:b[1],end:b[2],title:b[3],sub:b[4],assign:{},status:"未通知",note:""}));
function freshState(){
  let n=0;const roles={};
  for(const k in DEFAULT_ROLES) roles[k]=DEFAULT_ROLES[k].map(name=>({id:"r"+(++n),name}));
  return {v:2,nextId:n+1000,roles,leads:{...DEFAULT_LEADS},leadStatus:{},areas:[],areaOverrides:{},jobs:[],notes:"",privateNotes:"",sessions:[...PRESET.map((p,i)=>({id:"s"+i,room:p[0],day:p[1],start:p[2],end:p[3],title:p[4],sub:p[5],assign:{},status:"未通知",note:""})),...busSessions()],people:{}};
}
function valid(s){return s&&typeof s==="object"&&Array.isArray(s.sessions)&&s.roles&&typeof s.roles==="object"}
// 舊版資料：已填的人員全部保留，只移除沒填過的預設職務欄
function migrate(s){
  if(Number(s.v)>=2)return s;
  s.nextId=Number(s.nextId)||5000;
  s.sessions.forEach(x=>{if(x.room==="all"&&x.title==="報到")x.room="reg"});
  const old=s.roles,roles={};
  for(const r of ROOMS){
    const cand=old[r.k]||(r.k==="reg"?old.all:null)||[],rows=s.sessions.filter(x=>x.room===r.k);
    roles[r.k]=cand.filter(c=>!V1_ROLE_NAMES.includes(c.name)||rows.some(x=>x.assign&&String(x.assign[c.id]||"").trim()));
  }
  roles.bus=[{id:"r"+(s.nextId++),name:"隨車人員"}];
  s.roles=roles;
  if(!s.sessions.some(x=>x.room==="bus"))s.sessions.push(...busSessions());
  s.leads={...DEFAULT_LEADS,...(s.leads||{})};
  s.leadStatus=s.leadStatus||{};
  s.v=2;
  return s;
}
function normalize(s){
  migrate(s);
  s.people=s.people&&typeof s.people==="object"?s.people:{};
  s.leads=s.leads&&typeof s.leads==="object"?s.leads:{};
  s.leadStatus=s.leadStatus&&typeof s.leadStatus==="object"?s.leadStatus:{};
  s.nextId=Number(s.nextId)||5000;
  s.areas=(Array.isArray(s.areas)?s.areas:[]).filter(a=>a&&typeof a==="object"&&a.k&&a.name&&!BASE_ROOMS.some(r=>r.k===a.k));
  s.areaOverrides=s.areaOverrides&&typeof s.areaOverrides==="object"?s.areaOverrides:{};
  s.notes=String(s.notes||"");s.privateNotes=String(s.privateNotes||"");
  s.jobs=(Array.isArray(s.jobs)?s.jobs:[]).filter(j=>j&&typeof j==="object"&&j.id);
  s.jobs.forEach(j=>{j.title=String(j.title||"");j.people=String(j.people||"");j.note=String(j.note||"");if(!STATUS.includes(j.status))j.status=STATUS[0]});
  ROOMS.forEach(r=>{if(!Array.isArray(s.roles[r.k]))s.roles[r.k]=[]});
  s.sessions.forEach(x=>{x.assign=x.assign&&typeof x.assign==="object"?x.assign:{};if(!STATUS.includes(x.status))x.status=STATUS[0];x.note=x.note||"";x.sub=x.sub||""});
  return s;
}
const API="https://api.github.com";
function detectRepo(){
  const m=location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if(!m)return null;
  const seg=location.pathname.split("/").filter(Boolean)[0];
  return {owner:m[1],repo:seg&&!seg.includes(".")?seg:m[1]+".github.io"};
}

function publishable(s){

  for(const n in s.people){const g=s.people[n]&&s.people[n].group;people[n]=g?{group:g}:{}}
  return JSON.stringify({v:s.v,nextId:s.nextId,roles:s.roles,leads:s.leads,leadStatus:s.leadStatus,areas:s.areas,areaOverrides:s.areaOverrides,jobs:s.jobs,notes:s.notes||"",sessions:s.sessions,people},null,1);
}
function fmtTime(iso){const d=new Date(iso);if(isNaN(d))return "";const p=x=>String(x).padStart(2,"0");return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
function setHostedStatus(){

function progress(s){
  let need=0,done=0;
  for(const r of state.roles[s.room]||[]){const v=s.assign[r.id];if(isNA(v))continue;need++;if(names(v).length)done++}
  return {need,done,cls:need&&done>=need?"full":done?"part":""};
}
function sumProgress(list){return list.reduce((a,s)=>{const p=progress(s);a.need+=p.need;a.done+=p.done;return a},{need:0,done:0})}
function jobInfo(j){
  const s=j.linkId?state.sessions.find(x=>x.id===j.linkId):null;
  return s?{id:"job-"+j.id,room:s.room,day:s.day,start:s.start,end:s.end,title:j.title,link:s,linkId:s.id}:{id:"job-"+j.id,room:j.room,day:j.day,start:j.start,end:j.end,title:j.title,link:null,linkId:null};
}
const jobsInRoom=k=>state.jobs.filter(j=>jobInfo(j).room===k);
function linkLabel(s){const code=/^[A-Z]+\d+/.exec(s.sub||"");return (code?code[0]+" ":"")+s.title}
function areaProgress(k){
  const p=sumProgress(state.sessions.filter(s=>s.room===k)),r=roomOf(k),v=state.leads[k];
  for(const j of jobsInRoom(k)){p.need++;if(names(j.people).length)p.done++}
  if(r.lead&&!isNA(v)){p.need++;if(names(v).length)p.done++}
  return p;
}
function leadTasks(k){
  const r=roomOf(k),out=[];
  for(const d of ["d1","d2"]){
    const rows=state.sessions.filter(s=>s.room===k&&s.day===d);
    if(!rows.length)continue;
    out.push({id:"lead-"+k+"-"+d,room:k,day:d,start:rows.map(s=>s.start).sort()[0],end:rows.map(s=>s.end).sort().pop(),title:"全部場次",sub:"",isLead:true});
  }
  if(!out.length)out.push({id:"lead-"+k+"-x",room:k,day:"x",start:"",end:"",title:"全部場次",sub:"",isLead:true,noTime:true});
  return out;
}
function allTasks(){
  const map=new Map();
  for(const s of state.sessions)for(const r of state.roles[s.room]||[])for(const n of names(s.assign[r.id])){
    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:r.name,roleId:r.id});
  }
  for(const r of ROOMS)if(r.lead)for(const n of names(state.leads[r.k]))for(const s of leadTasks(r.k)){
    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:"負責人",roleId:"lead"});
  }
  for(const j of state.jobs)for(const n of names(j.people)){
    const s=jobInfo(j);
    if(!map.has(n))map.set(n,[]);map.get(n).push({s,role:s.link?linkLabel(s.link):"自訂工作",roleId:"job"});
  }
  for(const n of Object.keys(state.people))if(!map.has(n))map.set(n,[]);
  map.forEach(list=>list.sort((a,b)=>dayOf(a.s.day).k.localeCompare(dayOf(b.s.day).k)||byTime(a.s,b.s)));
  return map;
}
function overlaps(a,b){
  if(a.id===b.id||a.day!==b.day||a.day==="x")return false;
  if((a.isLead||b.isLead)&&a.room===b.room)return false;
  if(a.linkId&&(a.linkId===b.linkId||a.linkId===b.id))return false;
  if(b.linkId&&b.linkId===a.id)return false;
  return a.start<b.end&&b.start<a.end;
}
function conflictInfo(map){
  const bad=new Map();
  map.forEach((list,n)=>{list.forEach(t=>{const hit=list.filter(o=>overlaps(t.s,o.s));if(hit.length){if(!bad.has(n))bad.set(n,new Map());bad.get(n).set(t.s.id,hit)}})});
  return bad;
}

function refreshInputs(){
  const bad=conflictInfo(allTasks());
  document.querySelectorAll("input[data-s]").forEach(el=>{
    const ns=names(el.value),sid=el.dataset.s;
    const clash=ns.filter(n=>bad.has(n)&&bad.get(n).has(sid));
    el.classList.toggle("filled",ns.length>0&&!clash.length);
    el.classList.toggle("na",isNA(el.value));
    el.classList.toggle("conflict",clash.length>0);
    if(clash.length){
      el.title=clash.map(n=>n+" 同時段也在："+bad.get(n).get(sid).map(t=>roomOf(t.s.room).name+" "+t.s.title+"（"+t.s.start+"–"+t.s.end+"）").join("、")).join("\n");
    }else el.removeAttribute("title");
  });
  document.querySelectorAll("input[data-job]").forEach(el=>{
    const ns=names(el.value),id="job-"+el.dataset.job;
    const clash=ns.filter(n=>bad.has(n)&&bad.get(n).has(id));
    el.classList.toggle("conflict",clash.length>0);
    if(clash.length)el.title=clash.map(n=>n+" 同時段也在："+bad.get(n).get(id).map(t=>roomOf(t.s.room).name+" "+t.s.title+"（"+t.s.start+"–"+t.s.end+"）").join("、")).join("\n");else el.removeAttribute("title");
  });
  document.querySelectorAll("input[data-lead]").forEach(el=>{
    const k=el.dataset.lead,ns=names(el.value);
    const clash=ns.filter(n=>bad.has(n)&&[...bad.get(n).keys()].some(id=>id.startsWith("lead-"+k+"-")));
    el.classList.toggle("filled",ns.length>0&&!clash.length);
    el.classList.toggle("na",isNA(el.value));
    el.classList.toggle("conflict",clash.length>0);
    if(clash.length)el.title=clash.map(n=>n+" 有其他同時段的工作，詳見「人員」頁").join("\n");else el.removeAttribute("title");
  });
  const known=[...allTasks().keys()].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  $("peopleList").innerHTML=known.map(n=>'<option value="'+esc(n)+'">').join("");
}
function renderOverview(){
  let h=banners()+'<section class="cards">';
  for(const r of ROOMS){
    const p=areaProgress(r.k);
    h+='<article class="card"><button type="button" class="card-top" data-tab-go="'+esc(r.k)+'"><span><span class="card-name">'+esc(r.name)+'</span><span class="card-place">'+esc(r.place)+'</span></span><span class="chev" aria-hidden="true">›</span></button>';

}
const dayLabel=t=>t.s.noTime?"全程":dayOf(t.s.day).short;
function taskLine(t){const r=roomOf(t.s.room);return (t.s.noTime?"":t.s.start+"–"+t.s.end+"  ")+r.name+(r.noPlace?"":"（"+r.place+"）")+"  "+t.s.title+"｜"+t.role}
function personText(n,list){
  let out="【TAAI 2026 工作分配】"+n+"\n";
  const allDay=list.filter(t=>t.s.noTime);
  if(allDay.length)out+="\n全程\n"+allDay.map(taskLine).join("\n")+"\n";
  for(const d of DAYS){const ds=list.filter(t=>t.s.day===d.k&&!t.s.noTime);if(!ds.length)continue;out+="\n"+d.short+"\n"+ds.map(taskLine).join("\n")+"\n"}
  return out.trim();
}
const SEP=/([,，、;；\/／\n]+)/;
function mapNames(v,fn){
  const parts=String(v||"").split(SEP).map(x=>SEP.test(x)?x:fn(x.trim()));
  return parts.filter((x,i)=>x!==null).join("").replace(/^[,，、;；\/／\n\s]+|[,，、;；\/／\n\s]+$/g,"").replace(/([,，、;；\/／\n])[,，、;；\/／\n]+/g,"$1");
}
function eachField(fn){
  for(const s of state.sessions)for(const r in s.assign)s.assign[r]=mapNames(s.assign[r],fn);
  for(const k in state.leads)state.leads[k]=mapNames(state.leads[k],fn);
  for(const j of state.jobs)j.people=mapNames(j.people,fn);
}
function renamePerson(oldName,newName){
  if(state.people[newName]||allTasks().has(newName)){
    if(!window.confirm("名單裡已經有「"+newName+"」，要把「"+oldName+"」併過去嗎？"))return false;
  }
  eachField(x=>x===oldName?newName:x);
  const a=state.people[oldName]||{},b=state.people[newName]||{};
  delete state.people[oldName];
  state.people[newName]={...a,...b};
  ui.openPerson=newName;
  return true;
}
function removePerson(n){
  const c=(allTasks().get(n)||[]).length;
  if(!window.confirm("確定移除「"+n+"」？"+(c?"這個人目前的 "+c+" 項工作會變成未指派。":"")))return;
  eachField(x=>x===n?null:x);
  delete state.people[n];
  save();render();
}
function renderPeople(){
  const map=allTasks(),bad=conflictInfo(map);

      +'<div class="body"><div class="fields"><label class="edit-only">姓名<input data-rename="'+esc(n)+'" value="'+esc(n)+'"></label><label>組別<input data-pinfo="group" data-p="'+esc(n)+'" value="'+esc(info.group||"")+'"></label><label class="edit-only">聯絡方式'+(mode.hosted?"（不會發布）":"")+'<input data-pinfo="contact" data-p="'+esc(n)+'" value="'+esc(info.contact||"")+'"></label></div>';
    if(list.length){
      h+='<ul class="tasks">'+list.map(t=>{const c=cf&&cf.has(t.s.id);return '<li class="'+(c?"conflict":"")+'">'+esc(dayLabel(t))+" "+esc(taskLine(t))+(c&&mode.canEdit?"（時段重疊）":"")+"</li>"}).join("")+"</ul>"
        +'<div><button type="button" data-copy="'+i+'">複製工作單</button></div>';
    }else h+='<p class="tip">尚未分配工作。</p>';

function syncRooms(){
  const ov=state.areaOverrides||{};
  const base=BASE_ROOMS.map(r=>{const o=ov[r.k];return o?{...r,name:o.name||r.name,place:o.place||r.place,noPlace:o.place?false:r.noPlace}:{...r}});
  const custom=(state.areas||[]).map(a=>({k:a.k,name:a.name,place:a.place||"地點待補",noPlace:!a.place,lead:true,custom:true}));
  const i=base.findIndex(r=>r.k==="all");
  ROOMS.length=0;ROOMS.push(...base.slice(0,i),...custom,...base.slice(i));
  ROOMS.forEach(r=>{if(!Array.isArray(state.roles[r.k]))state.roles[r.k]=[]});
}

function stamp(){const d=new Date(),p=x=>String(x).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())}
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function sortedSessions(list){return [...list].sort((a,b)=>DAYS.findIndex(d=>d.k===a.day)-DAYS.findIndex(d=>d.k===b.day)||byTime(a,b)||ROOMS.findIndex(r=>r.k===a.room)-ROOMS.findIndex(r=>r.k===b.room))}
function flatRows(){
  const head=["日期","開始","結束","廳別","場地","場次／工作","說明","職務","人員","狀態","備註"],rows=[head];
  for(const r of ROOMS)if(r.lead)rows.push(["全程","","",r.name,r.noPlace?"":r.place,"全部場次","","負責人",(state.leads[r.k]||"").trim(),state.leadStatus[r.k]||STATUS[0],""]);
  for(const s of sortedSessions(state.sessions)){
    const r=roomOf(s.room);
    for(const role of state.roles[s.room]||[]){
      const v=s.assign[role.id]||"";
      if(isNA(v))continue;
      rows.push([dayOf(s.day).short,s.start,s.end,r.name,r.noPlace?"":r.place,s.title,s.sub,role.name,v.trim(),s.status,s.note]);
    }
  }
  for(const j of jobsSorted()){const i=jobInfo(j),r=roomOf(i.room);rows.push([dayOf(i.day).short,i.start,i.end,r.name,r.noPlace?"":r.place,j.title,i.link?"對應："+linkLabel(i.link):"自訂工作","工作",j.people.trim(),j.status,j.note])}
  return rows;
}
function jobsSorted(){
  return [...state.jobs].sort((a,b)=>{const x=jobInfo(a),y=jobInfo(b);return DAYS.findIndex(d=>d.k===x.day)-DAYS.findIndex(d=>d.k===y.day)||byTime(x,y)});
}
function jobRows(){
  return [["日期","開始","結束","區域","工作","對應議程","負責人","狀態","備註"],...jobsSorted().map(j=>{const i=jobInfo(j);return [dayOf(i.day).short,i.start,i.end,roomOf(i.room).name,j.title,i.link?linkLabel(i.link):"",j.people.trim(),j.status,j.note]})];
}
function peopleRows(){
  const rows=[["姓名","組別","聯絡方式","日期","開始","結束","區域","工作","職務／對應場次","時段重疊"]],map=allTasks(),bad=conflictInfo(map);
  [...map.keys()].sort((a,b)=>a.localeCompare(b,"zh-Hant")).forEach(n=>{
    const i=state.people[n]||{},list=map.get(n);
    if(!list.length)rows.push([n,i.group||"",i.contact||"","","","","","","",""]);
    list.forEach(t=>rows.push([n,i.group||"",i.contact||"",dayLabel(t),t.s.start,t.s.end,roomOf(t.s.room).name,t.s.title,t.role,bad.get(n)&&bad.get(n).has(t.s.id)?"是":""]));
  });
  return rows;
}
function roomRows(r){
  const roles=state.roles[r.k]||[],st=roles.length?["狀態"]:[],rows=[["日期","開始","結束","場次／工作","說明",...roles.map(x=>x.name),...st,"備註"]];
  sortedSessions(state.sessions.filter(s=>s.room===r.k)).forEach(s=>rows.push([dayOf(s.day).short,s.start,s.end,s.title,s.sub,...roles.map(x=>s.assign[x.id]||""),...(roles.length?[s.status]:[]),s.note]));
  return rows;
}
const csvCell=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function csvText(rows){return "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")}

// 不依賴外部函式庫的 xlsx 產生器（ZIP 不壓縮）
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcTable[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
  let p=0;for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
const xml=s=>String(s==null?"":s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colName=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
const widthOf=s=>[...String(s||"")].reduce((a,c)=>a+(c.charCodeAt(0)>255?2:1),0);
function sheetXml(rows){
  const cols=Math.max(...rows.map(r=>r.length)),w=[];
  for(let c=0;c<cols;c++)w[c]=Math.min(46,Math.max(8,...rows.map(r=>widthOf(r[c])+2)));
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>'
    +w.map((v,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+v+'" customWidth="1"/>').join("")+"</cols><sheetData>";
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">'+r.map((v,ci)=>'<c r="'+colName(ci)+(ri+1)+'" s="'+(ri?1:2)+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+"</t></is></c>").join("")+"</row>";
  });
  return x+"</sheetData></worksheet>";
}
function buildXlsx(){
  const leadRows=[["區域","地點","負責人","狀態"],...ROOMS.filter(r=>r.lead).map(r=>[r.name,r.place,(state.leads[r.k]||"").trim(),state.leadStatus[r.k]||STATUS[0]])];
  const sheets=[{name:"負責人總覽",rows:leadRows},{name:"工作",rows:jobRows()},...(state.notes.trim()?[{name:"備註",rows:[["備註"],...state.notes.split("\n").map(x=>[x])]}]:[]),{name:"總表",rows:flatRows()},...ROOMS.map(r=>({name:r.name,rows:roomRows(r)})),{name:"人員工作單",rows:peopleRows()}];
  const seen=new Set();
  sheets.forEach(s=>{
    const base=(String(s.name).replace(/[\[\]:*?\/\\]/g," ").trim()||"工作表").slice(0,28);let n=base,c=2;
    while(seen.has(n))n=base+" "+(c++);
    seen.add(n);s.name=n;
  });
  const files=[
    {name:"[Content_Types].xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+"</Types>"},
    {name:"_rels/.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+"</sheets></workbook>"},
    {name:"xl/_rels/workbook.xml.rels",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"xl/styles.xml",text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF17607A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="49" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/></cellXfs></styleSheet>'}
  ];
  sheets.forEach((s,i)=>files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",text:sheetXml(s.rows)}));
  return zipStore(files);
}
$("btnXlsx").addEventListener("click",()=>download("TAAI2026派工表-"+stamp()+".xlsx",new Blob([buildXlsx()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})));
$("btnCsv").addEventListener("click",()=>download("TAAI2026派工表-"+stamp()+".csv",new Blob([csvText(flatRows())],{type:"text/csv;charset=utf-8"})));
$("btnJson").addEventListener("click",()=>download("TAAI2026派工備份-"+stamp()+".json",new Blob([JSON.stringify(state,null,2)],{type:"application/json"})));
$("btnImport").addEventListener("click",()=>$("fileImport").click());
$("fileImport").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!valid(p))throw new Error("format");
      if(!window.confirm("還原會用備份檔「"+f.name+"」覆蓋目前所有內容，確定嗎？"))return;
      state=normalize(p);saveNow();ui.message="已從「"+f.name+"」還原。";ui.msgErr=false;
    }catch(err){ui.message="這個檔案不是派工表備份，內容沒有變更。請選擇按「備份」存下的 .json 檔。";ui.msgErr=true}
    render();
  };
  rd.readAsText(f);e.target.value="";
});
// GitHub Pages：所有人讀 data.json，登入後才能發布
const TOKEN_KEY=KEY+"-token";
const ghHeaders=()=>({Authorization:"Bearer "+mode.token,Accept:"application/vnd.github+json"});
const contentsUrl=()=>API+"/repos/"+REPO.owner+"/"+REPO.repo+"/contents/data.json";
async function fetchRemote(){
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const p=JSON.parse(await r.text());
  if(!valid(p))throw new Error("format");
  return p;
}
function adoptRemote(remote){
  const at=remote.updatedAt;
  const s=normalize(remote);s.updatedAt=at;
  mode.remoteText=publishable(s);
  return s;
}
function mergeLocal(remoteState){
  let local=null;
  try{const raw=localStorage.getItem(KEY);local=raw?JSON.parse(raw):null}catch(e){}
  if(!valid(local))return remoteState;
  local=normalize(local);
  if(local.updatedAt===remoteState.updatedAt)return local;
  if(publishable(local)!==mode.remoteText){
    try{localStorage.setItem(KEY+"-replaced",JSON.stringify(local))}catch(e){}
  }
  remoteState.privateNotes=local.privateNotes||"";
  for(const n in local.people){const c=local.people[n]&&local.people[n].contact;if(c){remoteState.people[n]=remoteState.people[n]||{};remoteState.people[n].contact=c}}
  return remoteState;
}
const noWriteMessage=()=>"這個 token 沒有寫入權限。請到 GitHub 的 token 設定，把 "+REPO.repo+" 加進 Repository access，並把 Contents 設為 Read and write，儲存後再試一次。";
async function checkToken(){
  const r=await fetch(API+"/repos/"+REPO.owner+"/"+REPO.repo,{headers:ghHeaders()});
  if(!r.ok)return "bad";
  const j=await r.json();
  if(!(j.permissions&&j.permissions.push))return "bad";
  // 故意送無效內容：權限足夠時 GitHub 回 422 且不會寫入，權限不足則回 403
  const probe=await fetch(contentsUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify({message:"check",content:"!"})});
  if(probe.status===401)return "bad";
  return probe.status===403?"nowrite":"ok";
}
async function loadHosted(){
  try{
    const remote=adoptRemote(await fetchRemote());
    state=mode.canEdit?mergeLocal(remote):remote;
  }catch(e){
    ui.message="讀不到最新資料，目前顯示的是預設內容。請稍後重新整理。";ui.msgErr=true;
    if(mode.canEdit){try{const l=JSON.parse(localStorage.getItem(KEY)||"null");if(valid(l))state=normalize(l)}catch(err){}}
  }
  render();
}
async function boot(){
  if(!REPO)return;
  try{mode.token=localStorage.getItem(TOKEN_KEY)}catch(e){}
  if(mode.token){
    let res="error";try{res=await checkToken()}catch(e){}
    if(res==="bad"){mode.token=null;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}ui.message="編輯登入已失效，請重新登入。";ui.msgErr=true}
    else{
      mode.canEdit=true;
      if(res==="nowrite"){ui.message=noWriteMessage();ui.msgErr=true}
    }
  }
  await loadHosted();
  setInterval(async()=>{
    if(mode.canEdit||document.hidden)return;
    try{const p=await fetchRemote();if(p.updatedAt!==state.updatedAt){state=adoptRemote(p);render()}}catch(e){}
  },60000);
}
function toB64(text){
  const b=new TextEncoder().encode(text);let s="";
  for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));
  return btoa(s);
}
$("btnPublish").addEventListener("click",async()=>{
  mode.publishing=true;$("btnPublish").textContent="發布中…";setHostedStatus();
  try{
    const head=await fetch(contentsUrl()+"?t="+Date.now(),{headers:ghHeaders()});
    if(head.status!==200&&head.status!==404)throw new Error("status "+head.status);
    const sha=head.status===200?(await head.json()).sha:undefined;
    const body=publishable(state),at=new Date().toISOString(),obj=JSON.parse(body);obj.updatedAt=at;
    const put=await fetch(contentsUrl(),{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},body:JSON.stringify({message:"更新派工表",content:toB64(JSON.stringify(obj,null,1)),...(sha?{sha}:{})})});
    if(!put.ok)throw new Error("status "+put.status);
    state.updatedAt=at;mode.remoteText=body;saveNow();
    ui.message="已發布。大家重新整理後約 1 分鐘內會看到。";ui.msgErr=false;
  }catch(e){
    const m=String(e.message||"");
    ui.message=/403/.test(m)?"發布失敗："+noWriteMessage():/401/.test(m)?"發布失敗：token 已失效或過期，請登出後用新的 token 登入。":/409|422/.test(m)?"發布失敗：GitHub 上的資料剛更新過，請再按一次發布。":"發布失敗，內容還保留在這個瀏覽器。請確認網路後再試。";ui.msgErr=true;
  }
  mode.publishing=false;$("btnPublish").textContent="發布更新";render();
});
document.addEventListener("click",e=>{const m=$("menu");if(m.open&&(!m.contains(e.target)||e.target.closest(".menu-list")))m.open=false});
$("btnLogin").addEventListener("click",async()=>{
  if(mode.canEdit){
    if(publishable(state)!==mode.remoteText&&!window.confirm("還有未發布的變更，登出後別人看不到。確定登出嗎？"))return;
    saveNow();mode.canEdit=false;mode.token=null;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
    await loadHosted();return;
  }
  $("fToken").value="";$("loginErr").hidden=true;$("dlgLogin").showModal();
});
$("loginCancel").addEventListener("click",()=>$("dlgLogin").close());
$("formLogin").addEventListener("submit",async e=>{
  e.preventDefault();
  mode.token=$("fToken").value.trim();
  let res="error";try{res=await checkToken()}catch(err){}
  if(res!=="ok"){
    mode.token=null;$("loginErr").hidden=false;
    $("loginErr").textContent=res==="nowrite"?noWriteMessage():res==="bad"?"登入失敗：這個 token 無效，或它的帳號沒有這個 repo 的權限。":"連不上 GitHub，請確認網路後再試。";
    return;
  }
  try{localStorage.setItem(TOKEN_KEY,mode.token)}catch(err){}
  mode.canEdit=true;$("fToken").value="";$("dlgLogin").close();
  await loadHosted();
});
window.TAAI={buildXlsx,flatRows,peopleRows,csvText,getState:()=>state,mode,publishable};
render();
boot();
